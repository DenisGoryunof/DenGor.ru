<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система координат | Калькулятор окружности</title>
    <style>
        :root {
            --bg-dark: #1a1a1a;
            --bg-panel: #2a2a2a;
            --bg-input: #111;
            --text-main: #e0e0e0;
            --text-dim: #888;
            --accent-green: #00ff41;
            --accent-blue: #4da6ff;
            --accent-red: #ff4d4d;
            --border: #444;
        }

        * {
            box-sizing: border-box;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        body {
            margin: 0;
            padding: 16px;
            background: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .calculator {
            max-width: 600px;
            width: 100%;
            background: var(--bg-panel);
            border: 2px solid #555;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* Заголовок в стиле FANUC */
        .header {
            background: #000;
            border: 1px solid #333;
            padding: 8px 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
        }
        .header-title {
            color: #ffcc00;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 1px;
        }
        .header-sub {
            color: var(--text-dim);
            font-size: 12px;
        }

        /* Селектор системы координат */
        .coord-system {
            background: #000;
            border: 1px solid var(--border);
            padding: 10px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-radius: 4px;
        }
        .coord-system label {
            color: var(--accent-green);
            font-weight: bold;
            font-size: 14px;
        }
        .coord-system select {
            background: var(--bg-input);
            color: var(--accent-green);
            border: 1px solid var(--border);
            padding: 6px 10px;
            font-size: 16px;
            font-family: inherit;
            border-radius: 3px;
            cursor: pointer;
            flex: 1;
        }
        .coord-system select:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        /* Сетка для точек */
        .points-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        @media (min-width: 500px) {
            .points-grid {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }

        .point-group {
            background: #000;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 4px;
        }
        .point-title {
            color: #ffcc00;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
            border-bottom: 1px dashed #333;
            padding-bottom: 6px;
        }

        /* Вертикальное расположение X и Y */
        .coord-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .coord-field {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .coord-field label {
            color: var(--accent-blue);
            font-weight: bold;
            font-size: 16px;
            width: 20px;
            text-align: center;
        }
        .coord-field input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--accent-green);
            font-size: 16px;
            font-family: inherit;
            padding: 8px;
            text-align: right;
            border-radius: 3px;
        }
        .coord-field input:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 5px rgba(0, 255, 65, 0.3);
        }
        /* Убираем стрелки у number input */
        .coord-field input::-webkit-outer-spin-button,
        .coord-field input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .coord-field input[type=number] {
            -moz-appearance: textfield;
        }

        /* Кнопки */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        button {
            flex: 1;
            background: #333;
            color: var(--text-main);
            border: 1px solid #555;
            border-radius: 4px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }
        button:hover {
            background: #444;
            border-color: #777;
        }
        button:active {
            transform: scale(0.98);
        }
        button.primary {
            background: #1a3a1a;
            color: var(--accent-green);
            border-color: var(--accent-green);
        }
        button.primary:hover {
            background: #2a5a2a;
        }
        button.danger {
            background: #3a1a1a;
            color: var(--accent-red);
            border-color: var(--accent-red);
        }
        button.danger:hover {
            background: #5a2a2a;
        }

        /* Результат */
        .result {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .result-title {
            color: var(--text-dim);
            font-size: 12px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .result-value {
            font-size: 20px;
            color: var(--accent-green);
            font-weight: bold;
            margin-bottom: 12px;
        }
        .result-value:last-child {
            margin-bottom: 0;
        }
        .error {
            color: var(--accent-red);
            font-weight: bold;
        }

        /* История */
        .history {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        .history-title {
            color: #ffcc00;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 6px;
        }
        .history-item {
            border-bottom: 1px dashed #333;
            padding: 8px 0;
            font-size: 13px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-item:last-child {
            border-bottom: none;
        }
        .history-item span {
            color: var(--accent-green);
        }
        .history-item .coord-badge {
            background: #222;
            padding: 2px 6px;
            border-radius: 3px;
            color: var(--accent-blue);
            font-size: 11px;
            margin-right: 8px;
        }
        .no-history {
            color: var(--text-dim);
            font-style: italic;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <!-- Заголовок -->
        <div class="header">
            <div class="header-title">FANUC</div>
            <div class="header-sub">Series 0i-MF Plus</div>
        </div>

        <!-- Система координат -->
        <div class="coord-system">
            <label for="gcode">СИСТЕМА КООРДИНАТ:</label>
            <select id="gcode">
                <option value="G54" selected>G54 (Стандартная)</option>
                <option value="G55">G55</option>
                <option value="G56">G56</option>
                <option value="G57">G57</option>
                <option value="G58">G58</option>
                <option value="G59">G59</option>
            </select>
        </div>

        <!-- Точки -->
        <div class="points-grid">
            <!-- Точка 1 -->
            <div class="point-group">
                <div class="point-title">ТОЧКА 1</div>
                <div class="coord-row">
                    <div class="coord-field">
                        <label>X</label>
                        <input type="number" id="x1" step="any" value="67.5">
                    </div>
                    <div class="coord-field">
                        <label>Y</label>
                        <input type="number" id="y1" step="any" value="5">
                    </div>
                </div>
            </div>

            <!-- Точка 2 -->
            <div class="point-group">
                <div class="point-title">ТОЧКА 2</div>
                <div class="coord-row">
                    <div class="coord-field">
                        <label>X</label>
                        <input type="number" id="x2" step="any" value="5">
                    </div>
                    <div class="coord-field">
                        <label>Y</label>
                        <input type="number" id="y2" step="any" value="67.5">
                    </div>
                </div>
            </div>

            <!-- Точка 3 -->
            <div class="point-group">
                <div class="point-title">ТОЧКА 3</div>
                <div class="coord-row">
                    <div class="coord-field">
                        <label>X</label>
                        <input type="number" id="x3" step="any" value="-57.5">
                    </div>
                    <div class="coord-field">
                        <label>Y</label>
                        <input type="number" id="y3" step="any" value="5">
                    </div>
                </div>
            </div>
        </div>

        <!-- Кнопки -->
        <div class="btn-group">
            <button class="primary" id="calcBtn">Рассчитать</button>
            <button class="danger" id="clearHistoryBtn">Очистить историю</button>
        </div>

        <!-- Результат -->
        <div class="result" id="resultBox">
            <div class="result-title">Центр окружности (I, J)</div>
            <div class="result-value" id="centerDisplay">(X ; Y)</div>
            <div class="result-title">Радиус (R)</div>
            <div class="result-value" id="radiusDisplay">R</div>
            <div class="result-title">Диаметр (D)</div>
            <div class="result-value" id="diameterDisplay">D</div>
        </div>

        <!-- История -->
        <div class="history">
            <div class="history-title">ИСТОРИЯ ВЫЧИСЛЕНИЙ</div>
            <div id="historyList">
                <div class="no-history">История пуста</div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const x1 = document.getElementById('x1');
            const y1 = document.getElementById('y1');
            const x2 = document.getElementById('x2');
            const y2 = document.getElementById('y2');
            const x3 = document.getElementById('x3');
            const y3 = document.getElementById('y3');
            const gcodeSelect = document.getElementById('gcode');
            const btn = document.getElementById('calcBtn');
            const clearHistoryBtn = document.getElementById('clearHistoryBtn');
            const centerDisplay = document.getElementById('centerDisplay');
            const radiusDisplay = document.getElementById('radiusDisplay');
            const diameterDisplay = document.getElementById('diameterDisplay');
            const historyList = document.getElementById('historyList');

            // Загрузка истории из localStorage
            let history = JSON.parse(localStorage.getItem('circleCalcHistory')) || [];

            function formatNumber(num) {
                if (Number.isInteger(num)) return num.toString();
                return num.toFixed(3).replace(/\.?0+$/, '');
            }

            function renderHistory() {
                if (history.length === 0) {
                    historyList.innerHTML = '<div class="no-history">История пуста</div>';
                    return;
                }
                historyList.innerHTML = history.map(item => `
                    <div class="history-item">
                        <div>
                            <span class="coord-badge">${item.gcode}</span>
                            P1(${item.p1x};${item.p1y}) P2(${item.p2x};${item.p2y}) P3(${item.p3x};${item.p3y})
                        </div>
                        <div>
                            <span>R: ${item.radius}</span>
                        </div>
                    </div>
                `).reverse().join(''); // Сначала новые
            }

            function saveToHistory(gcode, points, result) {
                history.push({
                    gcode: gcode,
                    p1x: points.p1x, p1y: points.p1y,
                    p2x: points.p2x, p2y: points.p2y,
                    p3x: points.p3x, p3y: points.p3y,
                    center: result.center,
                    radius: result.radius,
                    diameter: result.diameter
                });
                // Ограничим историю 50 записями
                if (history.length > 50) history.shift();
                localStorage.setItem('circleCalcHistory', JSON.stringify(history));
                renderHistory();
            }

            function calculate() {
                const p1x = parseFloat(x1.value);
                const p1y = parseFloat(y1.value);
                const p2x = parseFloat(x2.value);
                const p2y = parseFloat(y2.value);
                const p3x = parseFloat(x3.value);
                const p3y = parseFloat(y3.value);

                if (isNaN(p1x) || isNaN(p1y) || isNaN(p2x) || isNaN(p2y) || isNaN(p3x) || isNaN(p3y)) {
                    centerDisplay.innerText = 'Ошибка ввода';
                    radiusDisplay.innerText = 'Заполните все поля';
                    diameterDisplay.innerText = '—';
                    centerDisplay.classList.add('error');
                    return;
                }
                centerDisplay.classList.remove('error');

                const area = p1x * (p2y - p3y) + p2x * (p3y - p1y) + p3x * (p1y - p2y);
                if (Math.abs(area) < 1e-10) {
                    centerDisplay.innerText = 'Точки на одной прямой';
                    radiusDisplay.innerText = 'Окружность не существует';
                    diameterDisplay.innerText = '—';
                    centerDisplay.classList.add('error');
                    return;
                }
                centerDisplay.classList.remove('error');

                const A = p1x * (p2y - p3y) - p1y * (p2x - p3x) + p2x * p3y - p3x * p2y;
                const B = (p1x * p1x + p1y * p1y) * (p3y - p2y) +
                          (p2x * p2x + p2y * p2y) * (p1y - p3y) +
                          (p3x * p3x + p3y * p3y) * (p2y - p1y);
                const C = (p1x * p1x + p1y * p1y) * (p2x - p3x) +
                          (p2x * p2x + p2y * p2y) * (p3x - p1x) +
                          (p3x * p3x + p3y * p3y) * (p1x - p2x);

                const cx = -B / (2 * A);
                const cy = -C / (2 * A);
                const radius = Math.hypot(cx - p1x, cy - p1y);
                const diameter = 2 * radius;

                const centerStr = `(${formatNumber(cx)} ; ${formatNumber(cy)})`;
                const radiusStr = formatNumber(radius);
                const diameterStr = formatNumber(diameter);

                centerDisplay.innerText = centerStr;
                radiusDisplay.innerText = radiusStr;
                diameterDisplay.innerText = diameterStr;

                // Сохраняем в историю
                saveToHistory(gcodeSelect.value, {
                    p1x, p1y, p2x, p2y, p3x, p3y
                }, {
                    center: centerStr,
                    radius: radiusStr,
                    diameter: diameterStr
                });
            }

            btn.addEventListener('click', calculate);

            clearHistoryBtn.addEventListener('click', () => {
                if (confirm('Очистить всю историю вычислений?')) {
                    history = [];
                    localStorage.removeItem('circleCalcHistory');
                    renderHistory();
                }
            });

            // Инициализация
            renderHistory();
            
            // При загрузке подставляем пример, но не сохраняем его в историю автоматически
            window.addEventListener('load', () => {
                x1.value = '67.5'; y1.value = '5';
                x2.value = '5'; y2.value = '67.5';
                x3.value = '-57.5'; y3.value = '5';
                // calculate(); // Закомментировано, чтобы не засорять историю при каждом обновлении
            });
        })();
    </script>
</body>
</html>
